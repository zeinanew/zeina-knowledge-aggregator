name: Collect and refresh

# GitHub Actions is the primary daily scheduler again, TEMPORARILY, until the Azure Pipeline
# (azure-pipelines.yml) can actually push to Azure Repos - it's fully set up and its GitHub push
# already works, but its Azure Repos push is still 403ing on a repo permission (TF401027,
# "GenericContribute") that needs an Azure DevOps admin to grant, which isn't available right now.
# Azure Pipelines' own `schedules:` cron has been paused in the Azure DevOps UI (not removed from
# the YAML) for the duration, specifically so it and this one don't both try to collect+commit at
# the same moment - that race is exactly what produces unresolvable data/*.json merge conflicts.
#
# Once the Azure Repos permission is fixed: remove this `schedule:` block again, un-pause the
# Azure Pipeline, and Azure goes back to being primary (see ARCHITECTURE.md). Until then this also
# still runs on demand and whenever sources.json (or any non-data file) changes, same as before.
on:
  schedule:
    # Three attempts instead of one: GitHub's scheduled triggers are best-effort and can be
    # delayed by hours (or dropped) under load on the free tier - seen in practice Oct 29-31,
    # where the 05:00 slot didn't fire until 10:41-11:16 UTC. Each extra attempt is nearly free:
    # collect.py no-ops to "0 new" and the commit step is diff-gated, so this just raises the odds
    # one of them lands close to on time without risking duplicate commits or wasted API quota.
    - cron: "0 5 * * *"  # 05:00 UTC = 08:00 Riyadh
    - cron: "0 8 * * *"  # 08:00 UTC = 11:00 Riyadh (catch-up)
    - cron: "0 11 * * *" # 11:00 UTC = 14:00 Riyadh (catch-up)
  workflow_dispatch:       # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect and summarize
        run: python scripts/collect.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save new data to the repo
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh feed $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash && git push
