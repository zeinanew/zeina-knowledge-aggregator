# Azure Pipelines equivalent of .github/workflows/refresh.yml - runs the collector on a daily
# schedule and on pushes to main (except data-only pushes), then commits data/ back and deploys
# the repo root as a static site via Azure Static Web Apps.
#
# This is the primary daily scheduler (the local Windows Task Scheduler job is a logon-triggered
# fallback only now - see scripts/refresh_local.ps1), because it runs in Microsoft's cloud
# regardless of whether anyone's laptop is on or logged in. GitHub Pages stays the live public
# site though, so the "Save new data to the repo" step below pushes the commit to GitHub as well
# as Azure Repos - Azure DevOps and GitHub don't know about each other on their own, so this job
# does it explicitly (see ARCHITECTURE.md).
#
# One-time setup needed before this does anything - see ARCHITECTURE.md's
# "Running the daily refresh from Azure DevOps (GitHub Pages stays the live site)" section for
# the full walkthrough:
#   1. Pipelines -> New pipeline -> point at this file.
#   2. Add Pipeline variables: GEMINI_API_KEY, GROQ_API_KEY, GITHUB_TOKEN, GITHUB_PUSH_TOKEN
#      (all secret), GEMINI_MODELS, GROQ_MODELS (plain), AZURE_STATIC_WEB_APPS_API_TOKEN (secret,
#      only if also deploying to Azure Static Web Apps).
#   3. Grant this project's Build Service identity "Contribute" on this repo (Project Settings ->
#      Repositories -> Security) so the "Save new data" step below can push to Azure Repos.

schedules:
  - cron: "0 5 * * *" # 05:00 UTC = 08:00 Riyadh, every day
    displayName: Daily refresh
    branches:
      include: [main]
    always: true

trigger:
  branches:
    include: [main]
  paths:
    exclude: [data/*]

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: true # lets the push-back step below use the job's own access token

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"

  - script: pip install -r requirements.txt
    displayName: Install dependencies

  - script: python scripts/collect.py
    displayName: Collect and summarize
    env:
      GEMINI_API_KEY: $(GEMINI_API_KEY)
      GEMINI_MODELS: $(GEMINI_MODELS)
      GROQ_API_KEY: $(GROQ_API_KEY)
      GROQ_MODELS: $(GROQ_MODELS)
      GITHUB_TOKEN: $(GITHUB_TOKEN)

  - script: |
      set +e # Azure runs script steps with `bash -e` by default - the conflict handling below
              # checks exit codes explicitly instead of relying on errexit to short-circuit.
      git config user.name "signal-desk-bot"
      git config user.email "signal-desk-bot@users.noreply.github.com"
      git add data
      git diff --cached --quiet || git commit -m "Refresh feed $(date -u +%Y-%m-%d)"
      LOCAL_COMMIT=$(git rev-parse HEAD)

      # Azure Repos ("origin", authenticated via the checkout step's persisted credentials) and
      # GitHub are two unrelated remotes - this job has to push the same commit to both
      # explicitly, the same way the local fallback job does it via two push URLs on one
      # "origin" (see ARCHITECTURE.md). Each push pulls --rebase first in case the other remote
      # (or a local-machine fallback run) landed a commit since this job started; on a
      # data/*.json conflict, keep this run's just-generated snapshot rather than attempt a
      # line-level JSON merge - same resolution scripts/refresh_local.ps1 uses.
      push_resolving_conflicts() {
        git pull --rebase --autostash "$1" main
        if [ $? -ne 0 ]; then
          echo "Pull from $1 conflicted - keeping this run's data/ snapshot"
          git diff --name-only --diff-filter=U | grep '^data/' | while read -r f; do
            git checkout "$LOCAL_COMMIT" -- "$f"
            git add "$f"
          done
          GIT_EDITOR=true git rebase --continue
        fi
        git push "$1" HEAD:main
      }

      # set +e above means a failed push here wouldn't otherwise fail this step - check both and
      # fail the job explicitly if either didn't make it, so a bad token or lost permission shows
      # up as a red pipeline run instead of a silent gap in one of the two remotes.
      push_resolving_conflicts origin
      origin_ok=$?
      push_resolving_conflicts "https://x-access-token:$GITHUB_PUSH_TOKEN@github.com/zeinanew/zeina-knowledge-aggregator.git"
      github_ok=$?
      if [ $origin_ok -ne 0 ] || [ $github_ok -ne 0 ]; then
        echo "Push failed - Azure Repos: $([ $origin_ok -eq 0 ] && echo ok || echo FAILED), GitHub: $([ $github_ok -eq 0 ] && echo ok || echo FAILED)"
        exit 1
      fi
    displayName: Save new data to the repo (Azure Repos + GitHub)
    env:
      GITHUB_PUSH_TOKEN: $(GITHUB_PUSH_TOKEN)

  - task: AzureStaticWebApp@0
    displayName: Deploy static site
    inputs:
      app_location: "/"
      output_location: ""
      skip_app_build: true
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
